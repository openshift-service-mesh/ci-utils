project:
  name: ml-classifier-service
  description: A FastAPI-based ML inference service that classifies text documents into predefined categories using a scikit-learn model trained offline and loaded at startup.
  type: service

languages:
  primary: python
  secondary: [bash]

frameworks:
  - name: fastapi
    purpose: Async HTTP API framework
    version: "0.104.1"
  - name: scikit-learn
    purpose: Machine learning model training and inference
    version: "1.3.2"
  - name: pydantic
    purpose: Request/response data validation and settings management
    version: "2.5.0"
  - name: uvicorn
    purpose: ASGI server for serving FastAPI application
    version: "0.24.0"

architecture:
  pattern: ML inference microservice
  description: >
    Single-process FastAPI service with a startup lifecycle that loads a pre-trained
    scikit-learn model from disk. Incoming classification requests are validated by
    Pydantic, forwarded to MLClassifier, and results returned as JSON. The Settings
    class manages configuration via environment variables.
  components:
    - name: APIRouter
      path: app/routers/classify.py
      type: handler
      description: FastAPI router that exposes POST /classify and GET /health endpoints; delegates inference to MLClassifier
    - name: MLClassifier
      path: app/ml/classifier.py
      type: service
      description: Loads the pickled scikit-learn Pipeline from disk at startup and exposes a predict() method; handles model warm-up and error states
    - name: Settings
      path: app/config.py
      type: configuration
      description: Pydantic BaseSettings class that reads MODEL_PATH, LOG_LEVEL, MAX_BATCH_SIZE from environment variables with sensible defaults
    - name: schemas
      path: app/schemas.py
      type: model
      description: Pydantic models for ClassificationRequest (text, top_k) and ClassificationResponse (label, confidence, label_scores)

entry_points:
  - main.py

build_system:
  name: poetry
  config_file: pyproject.toml
  commands:
    install: poetry install
    test: poetry run pytest
    run: poetry run uvicorn main:app --reload
    lint: poetry run ruff check .
    format: poetry run black .
    typecheck: poetry run mypy app/

test_framework:
  name: pytest
  test_dir: tests/
  flags: -v --cov=app --cov-report=term-missing

key_directories:
  - path: app/
    purpose: Application package — all business logic and API code
  - path: app/routers/
    purpose: FastAPI route handlers organized by resource
  - path: app/ml/
    purpose: Model loading, inference, and preprocessing utilities
  - path: tests/
    purpose: pytest test suite; mirrors app/ structure
  - path: models/
    purpose: Serialized scikit-learn Pipeline files (.pkl); not committed to git

dependencies:
  - name: fastapi
    version: "0.104.1"
    purpose: Async HTTP framework
  - name: scikit-learn
    version: "1.3.2"
    purpose: ML model training and inference
  - name: pydantic
    version: "2.5.0"
    purpose: Data validation and settings
  - name: uvicorn
    version: "0.24.0"
    purpose: ASGI server
  - name: pytest
    version: "7.4.3"
    purpose: Test runner
  - name: pytest-asyncio
    version: "0.21.1"
    purpose: Async test support for FastAPI endpoints
