project:
  name: user-api
  description: A REST API service that manages user accounts, authentication, and profile data for the platform.
  type: service

languages:
  primary: go
  secondary: [bash, makefile]

frameworks:
  - name: gin
    purpose: HTTP routing and middleware
    version: v1.9.1
  - name: gorm
    purpose: ORM for PostgreSQL database access
    version: v1.25.4

architecture:
  pattern: REST microservice
  description: >
    Single-service REST API with layered architecture: HTTP handlers delegate to a
    service layer, which calls repositories for data access. PostgreSQL is used for
    persistence. The service is stateless and horizontally scalable.
  components:
    - name: UserHandler
      path: handlers/user.go
      type: handler
      description: Handles user CRUD HTTP endpoints (GET /users, POST /users, PUT /users/:id, DELETE /users/:id)
    - name: HealthHandler
      path: handlers/health.go
      type: handler
      description: Provides /healthz and /readyz endpoints for Kubernetes liveness and readiness probes
    - name: UserService
      path: services/user.go
      type: service
      description: Business logic for user management including validation, password hashing, and email uniqueness checks
    - name: UserRepository
      path: repositories/user.go
      type: repository
      description: PostgreSQL-backed repository for user persistence using GORM; implements UserStore interface
    - name: Router
      path: router/router.go
      type: infrastructure
      description: Configures gin router with middleware (logging, recovery, auth) and registers all route groups

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run
    lint: make lint
    generate: make generate

test_framework:
  name: testing
  runner: go test
  test_dir: .
  flags: -v -race -coverprofile=coverage.out ./...

key_directories:
  - path: handlers/
    purpose: HTTP request handlers — one file per resource
  - path: services/
    purpose: Business logic layer; no direct DB access
  - path: repositories/
    purpose: Data access layer; implements interfaces defined in services/
  - path: router/
    purpose: Route registration and middleware configuration
  - path: models/
    purpose: Domain model structs shared across layers

dependencies:
  - name: gin
    version: v1.9.1
    purpose: HTTP routing framework
  - name: gorm
    version: v1.25.4
    purpose: ORM for PostgreSQL
  - name: pgx
    version: v5.4.3
    purpose: PostgreSQL driver
  - name: bcrypt
    version: v0.13.0
    purpose: Password hashing (golang.org/x/crypto)
  - name: testify
    version: v1.8.4
    purpose: Test assertions and mocking
