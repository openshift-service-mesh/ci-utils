project:
  name: platform-gateway
  description: An API gateway service that routes requests to downstream microservices, enforces authentication, and exposes Prometheus metrics for operational monitoring.
  type: service

languages:
  primary: go
  secondary: [bash, dockerfile, makefile]

frameworks:
  - name: gin
    purpose: HTTP routing and middleware
    version: v1.9.1
  - name: prometheus
    purpose: Metrics exposition and instrumentation
    version: v1.17.0

architecture:
  pattern: API gateway
  description: >
    Stateless reverse proxy that authenticates requests, forwards them to upstream
    services, and records per-route latency and error metrics. Deployed as a
    Kubernetes Deployment with HPA scaling on CPU. Health probes are provided
    for liveness (/healthz) and readiness (/readyz).
  components:
    - name: Server
      path: server/server.go
      type: infrastructure
      description: Initializes the gin engine, registers middleware (auth, metrics, logging), and manages graceful shutdown on SIGTERM
    - name: HealthHandler
      path: handlers/health.go
      type: handler
      description: Provides /healthz (always 200) and /readyz (200 when upstream pool is healthy) probes
    - name: ProxyHandler
      path: handlers/proxy.go
      type: handler
      description: Reverse-proxies authenticated requests to configured upstream URLs; records latency histogram
    - name: AuthMiddleware
      path: middleware/auth.go
      type: middleware
      description: Validates Bearer JWT tokens against the configured JWKS endpoint; rejects with 401 on failure

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run
    docker-build: make docker-build
    deploy: make deploy
    lint: make lint

test_framework:
  name: testing
  runner: go test
  test_dir: .
  flags: -v -race ./...

key_directories:
  - path: handlers/
    purpose: HTTP request handlers for health, proxy, and admin endpoints
  - path: middleware/
    purpose: Gin middleware (auth, metrics, rate limiting)
  - path: server/
    purpose: Server lifecycle and startup configuration
  - path: deploy/
    purpose: Kubernetes manifests and Helm chart values

dependencies:
  - name: gin
    version: v1.9.1
    purpose: HTTP routing framework
  - name: prometheus
    version: v1.17.0
    purpose: Metrics exposition (promhttp handler)
  - name: jwt-go
    version: v5.2.0
    purpose: JWT token validation
