project:
  name: userservice
  description: Go REST microservice for managing user accounts
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  pattern: REST microservice
  description: Handler/model separation with Gin routing
  components:
    - name: UserHandler
      path: handlers/user.go
      type: handler
      description: Handles CRUD operations for user resources via HTTP
    - name: User
      path: models/user.go
      type: model
      description: Primary domain struct for user data

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run
    lint: make lint

test_framework:
  name: testing
  test_dir: .
  config: null
