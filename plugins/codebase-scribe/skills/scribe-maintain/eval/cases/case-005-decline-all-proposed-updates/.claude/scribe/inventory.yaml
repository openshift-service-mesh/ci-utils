project:
  name: catalogservice
  description: Go REST microservice for managing the product catalog
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  pattern: REST microservice
  description: Handler/model separation; only ProductHandler is listed (CategoryHandler is new, not yet inventoried)
  components:
    - name: ProductHandler
      path: handlers/product.go
      type: handler
      description: Handles List, Get, and Create operations for catalog products
    - name: Product
      path: models/product.go
      type: model
      description: Domain struct for catalog products

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run
    lint: make lint

test_framework:
  name: testing
  test_dir: .
  config: null
