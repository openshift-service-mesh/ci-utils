project:
  name: inventoryservice
  description: Go REST microservice for managing physical inventory items
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  pattern: REST microservice
  description: Handler/model separation; no metrics integration yet
  components:
    - name: InventoryHandler
      path: handlers/inventory.go
      type: handler
      description: Handles List, Get, and Create operations for inventory items
    - name: Item
      path: models/item.go
      type: model
      description: Domain struct for inventory items

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run

test_framework:
  name: testing
  test_dir: .
  config: null
