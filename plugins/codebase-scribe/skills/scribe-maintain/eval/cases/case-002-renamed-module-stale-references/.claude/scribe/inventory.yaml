project:
  name: apigateway
  description: Go API gateway with JWT authentication middleware
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware chain

architecture:
  pattern: REST microservice
  description: Edge gateway with global JWT middleware applied via Gin
  components:
    - name: JWTMiddleware
      path: auth/middleware.go
      type: middleware
      description: Validates Bearer JWT tokens on every incoming request (OLD path — package was auth)
    - name: main
      path: main.go
      type: entrypoint
      description: Wires middleware and routes, starts the HTTP listener

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    run: make run
    lint: make lint

test_framework:
  name: testing
  test_dir: .
  config: null
