# STALE: inventory captured before handlers/ was moved to api/v1/handlers/.
# The path handlers/user.go no longer exists; it is now api/v1/handlers/user.go.
project:
  name: notify-service
  description: A REST API service for user management
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  pattern: REST microservice
  description: Single-layer REST API. Handlers are in the handlers/ top-level directory.
  components:
    - name: UserHandler
      # STALE: this path no longer exists — moved to api/v1/handlers/user.go
      path: handlers/user.go
      type: handler
      description: Handles HTTP requests for user CRUD operations
    - name: User
      path: models/user.go
      type: model
      description: User domain model

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test

test_framework:
  name: testing
  test_dir: .
  config: null
