topic_content: |
  # Order Processing

  > This doc covers order creation, payment capture, and fulfillment under
  > `orders/`.

  ## Overview

  An order moves through three stages: creation, payment capture, and
  fulfillment, each owned by a dedicated file.

  ## Order Creation

  Orders are created by `OrderService.Create` in `orders/service.go`, which
  validates the cart and reserves inventory.

  ## Payment Capture

  Payment is captured by `CapturePayment` in `orders/capture.go`, which
  charges the customer's saved payment method and marks the order paid.

  ## Fulfillment

  Shipping cost is calculated by `CalculateShipping` in
  `orders/shipping.go`, using a flat per-region rate table.

