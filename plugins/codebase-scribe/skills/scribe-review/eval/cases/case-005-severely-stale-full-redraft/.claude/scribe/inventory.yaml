# STALE: inventory captured before the 3-layer refactor.
# services/ and repositories/ layers did not exist when this was written.
# handlers/ now contains order.go, user.go, and admin.go (not just user.go).
project:
  name: order-service
  description: A REST API service for managing orders
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  # STALE: was 2-layer before refactor. Now 3-layer: handler → service → repository
  pattern: REST microservice
  description: >
    Single-layer architecture. Handlers call the database directly via lib/pq.
    No service or repository layer exists.
  components:
    - name: UserHandler
      # STALE: was the only handler; now order.go and admin.go also exist
      path: handlers/user.go
      type: handler
      description: Handles all HTTP requests — user CRUD with direct DB access

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test
    # STALE: run target no longer exists
    run: make run

test_framework:
  name: testing
  test_dir: .
  config: null
