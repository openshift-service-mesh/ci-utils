topic_content: |
  # Feature Flags

  > This doc covers flag evaluation under `internal/flags/`.

  ## Overview

  Every call site checks a flag through a single evaluation entry point
  before branching.

  ## Evaluation

  Flags are evaluated by calling `EvaluateFlag` in
  `internal/flags/evaluator.go`. It looks up the flag by name and returns
  whether it is enabled for the current tenant.

