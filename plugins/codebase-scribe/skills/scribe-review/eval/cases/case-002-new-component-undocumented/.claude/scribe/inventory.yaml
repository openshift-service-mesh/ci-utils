# STALE: This inventory was captured before payment handlers were added.
# handlers/payment.go and models/payment.go are not reflected here.
project:
  name: store-service
  description: A REST API service for managing users
  type: service

languages:
  primary: go
  secondary: []

frameworks:
  - name: gin
    purpose: HTTP routing and middleware

architecture:
  pattern: REST microservice
  description: Single-layer REST API handling user operations.
  components:
    - name: UserHandler
      path: handlers/user.go
      type: handler
      description: Handles HTTP requests for user CRUD operations
    - name: User
      path: models/user.go
      type: model
      description: User domain model

entry_points:
  - main.go

build_system:
  name: make
  config_file: Makefile
  commands:
    build: make build
    test: make test

test_framework:
  name: testing
  test_dir: .
  config: null
