topic_content: |
  # Search Indexing

  > This doc covers the search index build pipeline under `internal/search/`.

  ## Overview

  The indexer was recently updated to support incremental indexing, and it
  now supports parallel workers for faster full rebuilds. Previously the
  indexer ran as a single-threaded batch job.

  ## Key Entry Points
  - `internal/search/indexer.go`: `BuildIndex` walks the corpus and writes
    the index using a configurable worker pool.

