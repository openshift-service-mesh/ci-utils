description: "CVE in libcurl. The Jira issue targets proxyv2-rhel9. Investigation shows that curl does NOT appear in the main Envoy repo's bazel/repository_locations.bzl — it is independently vendored in the proxy repo at ossm/vendor/curl/ with its own version pin in ossm/bazelrc-vendor. This means a proxy-specific fix PR is required after fixing the Envoy repo."
