# Guidance for responding to doc-update questions in this case.
#
# The skill should propose adding detail to the table-driven test convention in testing-practices.md.
# The existing doc mentions table-driven tests but gives no structural guidance on the struct shape,
# field order, slice name, or the tc := tc capture idiom.
#
# APPROVE with refinement — accept the proposed convention but suggest cleaner wording if the
# skill's proposed text is verbose or unclear. Specifically:
#
# If the skill proposes something like:
#   "Table-driven tests define cases as []struct{name, input, expected} and run with
#    for _, tc := range tests { t.Run(tc.name, ...) }"
# → Approve as-is. This is the correct level of detail.
#
# If the skill proposes wording that omits the tc := tc capture line:
# → Refine to add it: "Include tc := tc inside the loop to capture the range variable."
#
# If the skill proposes very verbose wording (full code block quoted from the diff):
# → Refine to a concise descriptive convention rather than a code block, keeping it readable.
#
# The engineer confirmed: slice is always named 'tests', field order is name → inputs → expected,
# and tc := tc is kept for clarity even on Go 1.22+.

per_change_guidance:
  - pattern: "table.driven|tests :=|tc := tc|t.Run.*tc.name|struct.*name.*input.*expected"
    action: approve_with_refinement
    rationale: >
      Approve the proposed convention. If the phrasing is accurate but verbose, suggest
      condensing it to: "Test cases are collected in a slice named `tests` using an
      anonymous struct with fields in order: name (string), input(s), expected output(s).
      The loop runs `tc := tc` to capture the range variable, then calls
      `t.Run(tc.name, func(t *testing.T) { ... })` for each case." Wording close to
      this is fine — approve any phrasing that captures the four key elements: slice name,
      struct field order, tc capture, and t.Run pattern.
