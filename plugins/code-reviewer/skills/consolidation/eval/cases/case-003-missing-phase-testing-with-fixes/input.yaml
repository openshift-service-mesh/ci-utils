  # Adversarial Review Report

  ## Review Unit: config/watcher.go

  ### Strengths
  - `config/watcher.go:34` — Uses `fsnotify.Watcher` correctly: registers the directory, not just the file, to catch atomic writes (rename-based editors).
  - `config/watcher.go:78` — Reload logic is wrapped in a deferred `recover()` to catch panics from malformed config.

  ### Issues

  #### Critical
  (none)

  #### Important
  - **BUG-1** [Goroutine leak] `config/watcher.go:55` — The event loop goroutine (`go w.watch()`) is started in `NewWatcher` but there is no mechanism to stop it if `Close()` is called while a reload is in progress. The goroutine blocks on `w.events <- event` indefinitely if the consumer channel is full. Fix: make the send select-with-context: `select { case w.events <- event: case <-w.ctx.Done(): return }`.

  #### Minor
  - **IMP-1** `config/watcher.go:102` — `debounce` duration is hardcoded to 200ms. Consider making it configurable via `WatcherOptions` for environments with slow filesystems.

  ### Improvements
  (none)

  ### Open Questions
  - Should the watcher emit the parsed config struct or the raw file bytes on reload? The current API emits raw bytes, which forces consumers to re-parse.

