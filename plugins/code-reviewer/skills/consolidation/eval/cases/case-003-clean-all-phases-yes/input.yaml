  ## Style Review Report [style] — Unit: config-loader

  ### Strengths
  - `config/loader.go:1`: Package-level godoc comment correctly describes the package purpose
  - `config/loader.go:30`: Exported types and functions all have descriptive godoc comments
  - `config/loader.go:55`: Naming follows project conventions throughout (PascalCase exports,
    camelCase unexported)

  ---
  ## Testing Review Report [testing] — Unit: config-loader

  ### Strengths
  - `config/loader_test.go:20`: Happy-path and error-path are both covered with table-driven tests
  - `config/loader_test.go:85`: Environment variable overrides are tested with `t.Setenv` to
    avoid test pollution
  - `config/loader_test.go:110`: Edge cases (empty string, zero value) are explicitly tested

