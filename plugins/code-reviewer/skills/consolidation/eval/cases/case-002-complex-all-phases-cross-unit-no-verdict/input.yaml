  #### Minor
  - **STY-1** [Error wrapping] `middleware/auth.go:156` — [style guide §Errors] Error returned as `fmt.Errorf("token invalid")` loses the original error context. Use `fmt.Errorf("token invalid: %w", err)` to preserve the chain.
  - **STY-2** [Logging] `middleware/auth.go:201` — [style guide §Logging] Log fields should use structured key-value pairs; bare string interpolation `fmt.Sprintf("token=%s", t)` is not structured. Use `slog.With("jti", claims.ID)`.

