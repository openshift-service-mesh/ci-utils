  # Adversarial Review Report

  ## Review Unit: ratelimit/limiter.go

  ### Strengths
  - `ratelimit/limiter.go:28` — Uses `time.Now` injected via interface for testability.
  - `ratelimit/limiter.go:55` — Overflow check before incrementing the token bucket counter.

  ### Issues

  #### Critical
  (none)

  #### Important
  - **BUG-1** [Missing error handling] `ratelimit/limiter.go:91` — `redis.Client.IncrBy` return value is ignored with `_, err = c.IncrBy(...)` but `err` is then used without checking: `if err != nil` is absent. If Redis is unavailable, the limiter silently allows all requests. Fix: check the error and either fail-open with logging or fail-closed depending on the configured policy.

  #### Minor
  - **IMP-1** `ratelimit/limiter.go:112` — `maxBurst` and `refillRate` are both stored as `float64` but all callers pass integer values. Using `int` or `int64` avoids floating-point precision issues for token counts.

  ### Improvements
  (none)

  ### Open Questions
  - Should the rate limiter support per-key TTLs or is a global TTL sufficient?

  ---

