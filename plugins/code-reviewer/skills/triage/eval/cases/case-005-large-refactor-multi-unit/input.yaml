  diff --git a/repositories/in_memory_user_repository.go b/repositories/in_memory_user_repository.go
  index 0000000..f1a2b63 100644
  --- /dev/null
  +++ b/repositories/in_memory_user_repository.go
  @@ -0,0 +1,55 @@
  +package repositories
  +
  +import (
  +	"context"
  +	"fmt"
  +	"sync"
  +	"myapp/models"
  +)
  +
  +// InMemoryUserRepository is a test double for UserRepository.
  +type InMemoryUserRepository struct {
  +	mu    sync.RWMutex
  +	store map[string]*models.User
  +	seq   int
  +}
  +
  +func NewInMemoryUserRepository() *InMemoryUserRepository {
  +	return &InMemoryUserRepository{store: make(map[string]*models.User)}
  +}
  +
  +func (r *InMemoryUserRepository) Insert(ctx context.Context, req models.CreateUserRequest) (*models.User, error) {
  +	r.mu.Lock()
  +	defer r.mu.Unlock()
  +	r.seq++
  +	u := &models.User{ID: fmt.Sprintf("user-%d", r.seq), Email: req.Email, Name: req.Name}
  +	r.store[u.ID] = u
  +	return u, nil
  +}
  +
  +func (r *InMemoryUserRepository) FindByID(ctx context.Context, id string) (*models.User, error) {
  +	r.mu.RLock()
  +	defer r.mu.RUnlock()
  +	u, ok := r.store[id]
  +	if !ok {
  +		return nil, models.ErrNotFound
  +	}
  +	return u, nil
  +}
  +
  +func (r *InMemoryUserRepository) FindAll(ctx context.Context, offset, limit int) ([]*models.User, error) {
  +	r.mu.RLock()
  +	defer r.mu.RUnlock()
  +	var all []*models.User
  +	for _, u := range r.store {
  +		all = append(all, u)
  +	}
  +	return all, nil
  +}
  +
  +func (r *InMemoryUserRepository) Update(ctx context.Context, user *models.User) (*models.User, error) {
  +	r.mu.Lock()
  +	defer r.mu.Unlock()
  +	r.store[user.ID] = user
  +	return user, nil
  +}
  +
  +func (r *InMemoryUserRepository) Delete(ctx context.Context, id string) error {
  +	r.mu.Lock()
  +	defer r.mu.Unlock()
  +	delete(r.store, id)
  +	return nil
  +}
