  diff --git a/services/user_service.go b/services/user_service.go
  index 0000000..c81a2f5 100644
  --- /dev/null
  +++ b/services/user_service.go
  @@ -0,0 +1,50 @@
  +package services
  +
  +import (
  +	"context"
  +	"myapp/models"
  +	"myapp/repositories"
  +)
  +
  +// UserService encapsulates business logic for user management.
  +type UserService struct {
  +	repo repositories.UserRepository
  +}
  +
  +// UserSvc is the package-level singleton.
  +var UserSvc = &UserService{}
  +
  +func (s *UserService) Create(ctx context.Context, req models.CreateUserRequest) (*models.User, error) {
  +	if req.Email == "" {
  +		return nil, models.ErrInvalidInput
  +	}
  +	return s.repo.Insert(ctx, req)
  +}
  +
  +func (s *UserService) GetByID(ctx context.Context, id string) (*models.User, error) {
  +	return s.repo.FindByID(ctx, id)
  +}
  +
  +func (s *UserService) List(ctx context.Context, page, limit int) ([]*models.User, error) {
  +	offset := (page - 1) * limit
  +	return s.repo.FindAll(ctx, offset, limit)
  +}
  +
  +func (s *UserService) Update(ctx context.Context, id string, req models.UpdateUserRequest) (*models.User, error) {
  +	existing, err := s.repo.FindByID(ctx, id)
  +	if err != nil {
  +		return nil, err
  +	}
  +	if req.Name != "" {
  +		existing.Name = req.Name
  +	}
  +	return s.repo.Update(ctx, existing)
  +}
  +
  +func (s *UserService) Delete(ctx context.Context, id string) error {
  +	return s.repo.Delete(ctx, id)
  +}
