unit_brief: |
  ## Change Overview
  Branch: feature/order-handler, Base: main, Files: 2 files changed

  ## Commit Messages
  - feat: add HTTP handler for creating and listing orders

  ## Files Changed
  - internal/order/handler.go (new file)
  - internal/order/handler_test.go (new file)

  ## Full Diff
  ```diff
  diff --git a/internal/order/handler.go b/internal/order/handler.go
  new file mode 100644
  index 0000000..8b1e2f3
  --- /dev/null
  +++ b/internal/order/handler.go
  @@ -0,0 +1,62 @@
  +package order
  +
  +import (
  +	"encoding/json"
  +	"net/http"
  +)
  +
  +// Order represents a customer order.
  +type Order struct {
  +	ID       string `json:"id"`
  +	Item     string `json:"item"`
  +	Quantity int    `json:"quantity"`
  +}
  +
  +// Store defines the persistence interface for Order records.
  +type Store interface {
  +	Create(o Order) (Order, error)
  +	List() ([]Order, error)
  +}
  +
  +// Handler holds the dependencies for order HTTP handlers.
  +type Handler struct {
  +	store Store
  +}
  +
  +// NewHandler constructs a Handler backed by the given Store.
  +func NewHandler(store Store) *Handler {
  +	return &Handler{store: store}
  +}
  +
  +// CreateOrder decodes a JSON body, persists the order, and returns it.
  +func (h *Handler) CreateOrder(w http.ResponseWriter, r *http.Request) {
  +	var o Order
  +	if err := json.NewDecoder(r.Body).Decode(&o); err != nil {
  +		http.Error(w, "invalid JSON body", http.StatusBadRequest)
  +		return
  +	}
  +	created, err := h.store.Create(o)
  +	if err != nil {
  +		http.Error(w, "internal error", http.StatusInternalServerError)
  +		return
  +	}
  +	w.Header().Set("Content-Type", "application/json")
  +	w.WriteHeader(http.StatusCreated)
  +	json.NewEncoder(w).Encode(created)
  +}
  +
  +// ListOrders fetches all orders and returns them as a JSON array.
  +func (h *Handler) ListOrders(w http.ResponseWriter, r *http.Request) {
  +	orders, err := h.store.List()
  +	if err != nil {
  +		http.Error(w, "internal error", http.StatusInternalServerError)
  +		return
  +	}
  +	w.Header().Set("Content-Type", "application/json")
  +	json.NewEncoder(w).Encode(orders)
  +}

  diff --git a/internal/order/handler_test.go b/internal/order/handler_test.go
  new file mode 100644
  index 0000000..3c4d5e6
  --- /dev/null
  +++ b/internal/order/handler_test.go
  @@ -0,0 +1,72 @@
  +package order_test
  +
  +import (
  +	"bytes"
  +	"encoding/json"
  +	"net/http"
  +	"net/http/httptest"
  +	"testing"
  +)
  +
  +type mockStore struct {
  +	createFunc func(o Order) (Order, error)
  +	listFunc   func() ([]Order, error)
  +}
  +
  +func (m *mockStore) Create(o Order) (Order, error) { return m.createFunc(o) }
  +func (m *mockStore) List() ([]Order, error)        { return m.listFunc() }
  +
  +func TestCreateOrderHandler(t *testing.T) {
  +	store := &mockStore{
  +		createFunc: func(o Order) (Order, error) {
  +			o.ID = "ord-1"
  +			return o, nil
  +		},
  +	}
  +	h := NewHandler(store)
  +
  +	body, err := json.Marshal(Order{Item: "widget", Quantity: 3})
  +	if err != nil {
  +		t.Fatal(err)
  +	}
  +
  +	req := httptest.NewRequest(http.MethodPost, "/orders", bytes.NewReader(body))
  +	req.Header.Set("Content-Type", "application/json")
  +	rr := httptest.NewRecorder()
  +
  +	h.CreateOrder(rr, req)
  +
  +	if rr.Code != http.StatusCreated {
  +		t.Fatalf("expected 201, got %d", rr.Code)
  +	}
  +
  +	var got Order
  +	err = json.NewDecoder(rr.Body).Decode(&got)
  +	if err != nil {
  +		t.Fatal(err)
  +	}
  +
  +	if got.ID != "ord-1" {
  +		t.Errorf("expected ID ord-1, got %s", got.ID)
  +	}
  +}
  +
  +func TestListOrdersHandler(t *testing.T) {
  +	store := &mockStore{
  +		listFunc: func() ([]Order, error) {
  +			return []Order{{ID: "ord-2", Item: "gadget", Quantity: 1}}, nil
  +		},
  +	}
  +	h := NewHandler(store)
  +
  +	req := httptest.NewRequest(http.MethodGet, "/orders", nil)
  +	rr := httptest.NewRecorder()
  +
  +	h.ListOrders(rr, req)
  +
  +	if rr.Code != http.StatusOK {
  +		t.Fatalf("expected 200, got %d", rr.Code)
  +	}
  +
  +	var got []Order
  +	err := json.NewDecoder(rr.Body).Decode(&got)
  +	if err != nil {
  +		t.Fatal(err)
  +	}
  +
  +	if len(got) != 1 || got[0].ID != "ord-2" {
  +		t.Errorf("unexpected orders: %+v", got)
  +	}
  +}
  ```

testing_practices_excerpt: |
  ## Assertions
  Always use `github.com/stretchr/testify/assert` for non-fatal assertions and
  `github.com/stretchr/testify/require` for fatal ones. Do NOT use raw `if err != nil { t.Fatal(err) }`
  or `if got != want { t.Errorf(...) }` patterns — these are harder to read and produce
  less descriptive failure messages.

  Correct pattern:
  ```go
  require.NoError(t, err)
  assert.Equal(t, http.StatusCreated, rr.Code)
  assert.Equal(t, "ord-1", got.ID)
  ```

  ## Test Naming
  Test function names must follow the `TestFuncName_Scenario` pattern, where Scenario
  describes the specific condition being tested (e.g., `TestCreateOrder_Success`,
  `TestListOrders_EmptyStore`). Generic names like `TestCreateOrderHandler` or
  `TestListOrdersHandler` do not meet this requirement.

  ## Table-Driven Tests
  Where a handler has multiple input scenarios (valid body, invalid JSON, store error),
  use table-driven tests with `t.Run(tc.name, ...)` rather than separate functions for
  each scenario.
